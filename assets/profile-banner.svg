<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dhoni Baptist — Engineering ideas into useful technology</title>
  <desc id="desc">A midnight-blue engineering banner with cyan circuit lines, subtle gridwork, and the labels Electronics, Software, Applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0A2340"/>
      <stop offset="1" stop-color="#102D4D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity=".85"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
