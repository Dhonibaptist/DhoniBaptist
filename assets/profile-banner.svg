    <circle cx="880" cy="35" r="4"/><circle cx="940" cy="70" r="4"/><circle cx="1090" cy="100" r="4"/>
    <circle cx="860" cy="275" r="4"/><circle cx="1000" cy="235" r="4"/><circle cx="1040" cy="295" r="4"/>
    <circle cx="165" cy="245" r="4"/><circle cx="130" cy="285" r="4"/>
