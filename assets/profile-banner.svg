    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="#22D3EE" stroke-opacity=".38" stroke-width="2">
