  <text x="88" y="244" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="21">Electronics • Software • Applied AI</text>
  <text x="88" y="291" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.4">TURNING IDEAS INTO USEFUL TECHNOLOGY</text>
